<!doctype html><html><head><meta charset="utf-8">

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createPlayerModel } from '../playerModel.js';
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight);
r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true; r.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8cc3f0);
const pm = new THREE.PMREMGenerator(r); scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture; scene.environmentIntensity = 0.45;

Object.assign(sun.shadow.camera, { left: -4, right: 4, top: 4, bottom: -4 }); scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfe0ff, 0x6a8a40, 0.9));

const n = +(q.get('n') || 1), models = [];
const camZ = +(q.get('cz') || 3.2), camY = +(q.get('cy') || 0.8);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 36), innerWidth / innerHeight, 0.05, 100);
const specs = (q.get('s') || '{}').split('|').map((x) => JSON.parse(x));
specs.forEach((sp, i) => { const m = createPlayerModel(); m.root.position.x = (i - (specs.length - 1) / 2) * +(q.get('gap') || 1.2); scene.add(m.root); models.push([m, sp]); });

let t = 0, last = performance.now();
const simT = +(q.get('t') || 0);
function step(dt) {
  t += dt;
  for (const [m, sp] of models) {
    let cur = sp;
    const tl = t - (sp.off || 0);
    if (sp.seq) { let acc = 0; cur = sp.seq[sp.seq.length - 1][1]; for (const [d, st] of sp.seq) { if (tl < acc + d) { cur = Object.assign({}, st); if (st.growT === 'ramp') cur.growT = (tl - acc) / d; break; } acc += d; } }
    const s = Object.assign({ vx: 0, vy: 0, onGround: true, facing: 1, speed: 0, power: 0, time: t, growT: -1, runMax: 10.2 }, cur);
    s.speed = Math.abs(s.vx); s.time = t;
    m.update(dt, s);
  }
}
for (let i = 0; i < simT * 60; i++) step(1 / 60);

function loop() { const now = performance.now(); const dt = Math.min(0.05, (now - last) / 1000); last = now; if (!q.get('freeze')) step(dt); r.render(scene, cam); requestAnimationFrame(loop); }
if (q.get("freeze")) { r.render(scene, cam); } else loop();
